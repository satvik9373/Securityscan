<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --text: #e8e4dc;
      --accent: #c8b89a;
      --card-bg: #111;
      --gap: 24px;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      overflow: hidden;
      cursor: none;
    }

    /* ── Custom cursor ── */
    #cursor {
      position: fixed; top: 0; left: 0;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--text);
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      mix-blend-mode: difference;
      transition: transform 0.1s;
    }
    #cursor.drag { transform: translate(-50%,-50%) scale(2.5); }

    /* ── WebGL canvas ── */
    #bg-canvas {
      position: fixed; inset: 0;
      z-index: 0;
      opacity: 0.35;
      pointer-events: none;
    }

    /* ── Header ── */
    #header {
      position: fixed; top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 28px 40px;
      display: flex; align-items: center; justify-content: space-between;
    }
    #header .logo {
      font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--text); opacity: 0.6;
    }
    #header nav a {
      font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--text); text-decoration: none; opacity: 0.5;
      margin-left: 32px;
      transition: opacity 0.2s;
    }
    #header nav a:hover { opacity: 1; }

    /* ── Drag hint ── */
    #drag-hint {
      position: fixed; bottom: 32px; left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--text); opacity: 0.35;
      pointer-events: none;
    }

    /* ── Canvas stage for draggable cards ── */
    #stage {
      position: fixed; inset: 0;
      z-index: 10;
      overflow: hidden;
    }
    #world {
      position: absolute;
      /* large enough to scroll around */
      width: 4200px; height: 3000px;
      will-change: transform;
    }

    /* ── Cards ── */
    .card {
      position: absolute;
      width: 300px;
      cursor: none;
      will-change: transform;
    }
    .card-inner {
      position: relative;
      border-radius: 4px;
      overflow: hidden;
      background: var(--card-bg);
    }
    .card-img {
      width: 100%; display: block;
      object-fit: cover;
      filter: grayscale(20%) contrast(1.05);
      transition: filter 0.4s;
    }
    .card:hover .card-img { filter: grayscale(0%) contrast(1.1); }

    .card-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.65) 0%, transparent 50%);
      opacity: 0; transition: opacity 0.35s;
    }
    .card:hover .card-overlay { opacity: 1; }

    .card-meta {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 16px 18px;
      transform: translateY(6px); opacity: 0;
      transition: transform 0.35s, opacity 0.35s;
    }
    .card:hover .card-meta { transform: translateY(0); opacity: 1; }

    .card-title {
      font-size: 13px; font-weight: 500;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: #fff; line-height: 1.3;
    }
    .card-sub {
      font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
      color: rgba(255,255,255,0.55); margin-top: 4px;
    }

    /* card number label */
    .card-num {
      position: absolute; top: 14px; right: 16px;
      font-size: 10px; letter-spacing: 0.14em;
      color: rgba(255,255,255,0.4);
    }

    /* ── Detail overlay ── */
    #detail {
      position: fixed; inset: 0;
      z-index: 200;
      background: var(--bg);
      display: flex; flex-direction: column;
      opacity: 0; pointer-events: none;
      overflow-y: auto;
    }
    #detail.active { pointer-events: all; }

    #detail-header {
      padding: 28px 40px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    #detail-close {
      background: none; border: none;
      color: var(--text); font-size: 12px; letter-spacing: 0.16em;
      text-transform: uppercase; cursor: none; opacity: 0.5;
      transition: opacity 0.2s;
    }
    #detail-close:hover { opacity: 1; }

    #detail-body {
      flex: 1;
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 0;
    }
    #detail-image-wrap {
      overflow: hidden;
    }
    #detail-image {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
    }
    #detail-info {
      padding: 60px 56px;
      display: flex; flex-direction: column; justify-content: center;
    }
    #detail-num {
      font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 20px;
    }
    #detail-title {
      font-size: clamp(28px, 4vw, 52px);
      font-weight: 300; letter-spacing: -0.01em; line-height: 1.1;
      margin-bottom: 24px;
    }
    #detail-desc {
      font-size: 14px; line-height: 1.75;
      color: rgba(232,228,220,0.55);
      max-width: 420px;
    }
    #detail-tags {
      display: flex; flex-wrap: wrap; gap: 8px;
      margin-top: 32px;
    }
    .detail-tag {
      font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase;
      border: 1px solid rgba(255,255,255,0.15);
      padding: 5px 12px; border-radius: 2px;
      color: rgba(255,255,255,0.45);
    }

    /* ── Scroll counter ── */
    #counter {
      position: fixed; right: 36px; top: 50%;
      transform: translateY(-50%);
      z-index: 100;
      writing-mode: vertical-rl;
      font-size: 10px; letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.2);
      pointer-events: none;
    }
  </style>
</head>
<body>

<div id="cursor"></div>

<canvas id="bg-canvas"></canvas>

<header id="header">
  <div class="logo">Depo — Studio</div>
  <nav>
    <a href="#">Work</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </nav>
</header>

<div id="counter">00 / 20</div>

<div id="stage">
  <div id="world"></div>
</div>

<div id="drag-hint">Drag to explore</div>

<!-- Detail page -->
<div id="detail">
  <div id="detail-header">
    <div class="logo">Depo — Studio</div>
    <button id="detail-close">Close ✕</button>
  </div>
  <div id="detail-body">
    <div id="detail-image-wrap">
      <img id="detail-image" src="" alt="" />
    </div>
    <div id="detail-info">
      <div id="detail-num"></div>
      <h1 id="detail-title"></h1>
      <p id="detail-desc"></p>
      <div id="detail-tags"></div>
    </div>
  </div>
</div>

<!-- GSAP + Three.js local vendor -->
<script src="vendor/gsap.min.js"></script>
<script src="vendor/three.min.js"></script>

<script>
/* ═══════════════════════════════════════════════
   DATA
═══════════════════════════════════════════════ */
const ITEMS = [
  { title: 'Vessel I',       sub: 'Ceramics',      year: '2024', tags: ['Clay','Glaze','Kiln'],          desc: 'A hand-thrown vessel exploring the tension between control and chance in reduction firing.' },
  { title: 'Nocturne',       sub: 'Photography',   year: '2023', tags: ['Long Exposure','Film','Night'], desc: 'Sixteen-minute exposure capturing the residue of urban light against a darkening sky.' },
  { title: 'Grid Study 04',  sub: 'Print',         year: '2024', tags: ['Risograph','2-Colour','Grid'],  desc: 'Part of an ongoing series interrogating the grid as both structure and disruption.' },
  { title: 'Lattice',        sub: 'Sculpture',     year: '2023', tags: ['Steel','Weld','Patina'],        desc: 'Welded steel lattice investigating weight, transparency, and the space between forms.' },
  { title: 'Dusk Protocol',  sub: 'Digital',       year: '2024', tags: ['Generative','p5.js','Color'],   desc: 'Algorithmic color field generated from ambient light sensor data recorded at dusk.' },
  { title: 'Soft Geometry',  sub: 'Textile',       year: '2023', tags: ['Linen','Dye','Fold'],           desc: 'Dyed linen panels folded and re-folded until the geometry emerges from the crease.' },
  { title: 'Archive 12',     sub: 'Photography',   year: '2022', tags: ['35mm','Scan','Archive'],        desc: 'Rediscovered contact sheet from a 1990s archive, reprinted at architectural scale.' },
  { title: 'Strata',         sub: 'Painting',      year: '2024', tags: ['Oil','Canvas','Layer'],         desc: 'Forty-three oil glazes applied and partially removed, revealing a geological interior.' },
  { title: 'Form & Shadow',  sub: 'Sculpture',     year: '2023', tags: ['Plaster','Cast','Light'],       desc: 'Cast plaster volumes placed to cast shadows that complete the composition.' },
  { title: 'Frequency',      sub: 'Print',         year: '2024', tags: ['Screen Print','Halftone','BW'], desc: 'Halftone screen print derived from audio waveform data mapped to visual frequency.' },
  { title: 'Mineral',        sub: 'Ceramics',      year: '2023', tags: ['Stoneware','Mineral','Ash'],    desc: 'Wood-fired stoneware drawing colour from mineral ash accumulated during the firing.' },
  { title: 'Periphery',      sub: 'Digital',       year: '2024', tags: ['WebGL','Shader','GLSL'],        desc: 'GLSL fragment shader exploring peripheral vision and the limits of focal attention.' },
  { title: 'Index',          sub: 'Publication',   year: '2023', tags: ['Book','Offset','Type'],         desc: 'Catalogue raisonné designed as a working index — every image annotated and cross-referenced.' },
  { title: 'Erosion',        sub: 'Photography',   year: '2022', tags: ['Large Format','Landscape','B&W'],desc: 'Large-format landscape documenting the slow erasure of a coastal path over three years.' },
  { title: 'Thread',         sub: 'Textile',       year: '2024', tags: ['Cotton','Weave','Structure'],   desc: 'Hand-woven cotton structure using a draft derived from a musical score.' },
  { title: 'Monument II',    sub: 'Sculpture',     year: '2023', tags: ['Bronze','Cast','Public'],       desc: 'Bronze casting exploring the gap between the monumental and the intimate.' },
  { title: 'Surface Test',   sub: 'Painting',      year: '2024', tags: ['Acrylic','Texture','Ground'],   desc: 'A systematic study of acrylic grounds — fifty variations on primer, sand, and gesture.' },
  { title: 'Horizon',        sub: 'Digital',       year: '2023', tags: ['3D','Blender','Atmosphere'],    desc: 'Rendered atmospheric study of an imagined horizon at the edge of a digital landscape.' },
  { title: 'Signal',         sub: 'Print',         year: '2024', tags: ['Letterpress','Type','Lead'],    desc: 'Letterpress broadside set in foundry lead type, printed on dampened cotton rag.' },
  { title: 'Vessel II',      sub: 'Ceramics',      year: '2024', tags: ['Porcelain','Wheel','Iron'],     desc: 'A companion to Vessel I — porcelain thrown thin enough to transmit light through the walls.' },
];

function imgUrl(idx) {
  return `images/img-${String(idx).padStart(2,'0')}.svg`;
}

/* ═══════════════════════════════════════════════
   THREE.JS BACKGROUND
═══════════════════════════════════════════════ */
(function initThree() {
  const canvas = document.getElementById('bg-canvas');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 100);
  camera.position.z = 5;

  /* Particle field */
  const COUNT = 1200;
  const positions = new Float32Array(COUNT * 3);
  for (let i = 0; i < COUNT; i++) {
    positions[i * 3]     = (Math.random() - 0.5) * 22;
    positions[i * 3 + 1] = (Math.random() - 0.5) * 22;
    positions[i * 3 + 2] = (Math.random() - 0.5) * 12;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const mat = new THREE.PointsMaterial({ color: 0xc8b89a, size: 0.045, transparent: true, opacity: 0.5 });
  const points = new THREE.Points(geo, mat);
  scene.add(points);

  /* Grid plane */
  const gridHelper = new THREE.GridHelper(30, 30, 0x222222, 0x181818);
  gridHelper.position.y = -4;
  gridHelper.rotation.x = 0.2;
  scene.add(gridHelper);

  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  resize();
  window.addEventListener('resize', resize);

  let mx = 0, my = 0;
  document.addEventListener('mousemove', e => {
    mx = (e.clientX / window.innerWidth  - 0.5) * 2;
    my = (e.clientY / window.innerHeight - 0.5) * 2;
  });

  let t = 0;
  (function tick() {
    requestAnimationFrame(tick);
    t += 0.004;
    points.rotation.y = t * 0.15 + mx * 0.12;
    points.rotation.x = my * 0.06;
    gridHelper.rotation.z = t * 0.02;
    renderer.render(scene, camera);
  })();
})();

/* ═══════════════════════════════════════════════
   CARD LAYOUT
═══════════════════════════════════════════════ */
const world = document.getElementById('world');
const WORLD_W = 4200, WORLD_H = 3000;

// Varying card heights for visual rhythm
const HEIGHTS = [380, 460, 340, 500, 410, 370, 490, 350, 440, 380, 460, 510, 360, 430, 390, 480, 340, 460, 520, 400];

// Manual layout positions for a scattered, editorial look
const POSITIONS = [
  [120, 120], [480, 60],  [840, 200], [1200, 80],  [1560, 140],
  [1900, 60], [2250, 180],[2600, 80], [2950, 120],  [3300, 70],
  [80, 640],  [460, 580], [820, 700], [1180, 560], [1540, 660],
  [1900, 580],[2240, 720],[2610, 600],[2960, 640],  [3290, 560],
];

ITEMS.forEach((item, i) => {
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.idx = i;
  card.style.cssText = `left:${POSITIONS[i][0]}px; top:${POSITIONS[i][1]}px; width:300px;`;

  const h = HEIGHTS[i];
  card.innerHTML = `
    <div class="card-inner">
      <img class="card-img" src="${imgUrl(i)}" alt="${item.title}" style="height:${h}px" loading="lazy" />
      <div class="card-overlay"></div>
      <div class="card-meta">
        <div class="card-title">${item.title}</div>
        <div class="card-sub">${item.sub} — ${item.year}</div>
      </div>
      <div class="card-num">${String(i + 1).padStart(2, '0')}</div>
    </div>`;

  world.appendChild(card);

  /* Subtle random tilt */
  const tilt = (Math.random() - 0.5) * 2.8;
  gsap.set(card, { rotation: tilt });

  /* Click → detail */
  card.addEventListener('click', () => openDetail(i));
});

/* ═══════════════════════════════════════════════
   DRAG / PAN  (Lenis-style inertia via GSAP)
═══════════════════════════════════════════════ */
const stage = document.getElementById('stage');
const cursor = document.getElementById('cursor');

// Start world centred
const startX = -(WORLD_W / 2 - window.innerWidth  / 2);
const startY = -(WORLD_H / 2 - window.innerHeight / 2);
let wx = startX, wy = startY;          // current world position
let vx = 0, vy = 0;                   // velocity
let dragging = false;
let lastMX = 0, lastMY = 0;
let lastDX = 0, lastDY = 0;
const FRICTION = 0.88;                 // inertia damping

gsap.set('#world', { x: wx, y: wy });

/* Cursor follow */
document.addEventListener('mousemove', e => {
  gsap.to(cursor, { x: e.clientX, y: e.clientY, duration: 0.06, ease: 'none' });
});

/* Drag start */
stage.addEventListener('mousedown', e => {
  dragging = true;
  lastMX = e.clientX;
  lastMY = e.clientY;
  vx = vy = 0;
  cursor.classList.add('drag');
  e.preventDefault();
});

/* Drag move */
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  lastDX = e.clientX - lastMX;
  lastDY = e.clientY - lastMY;
  wx += lastDX;
  wy += lastDY;
  lastMX = e.clientX;
  lastMY = e.clientY;
  gsap.set('#world', { x: wx, y: wy });
  updateCounter();
});

/* Drag end → release velocity */
window.addEventListener('mouseup', () => {
  if (!dragging) return;
  dragging = false;
  vx = lastDX * 1.8;
  vy = lastDY * 1.8;
  cursor.classList.remove('drag');
  lastDX = lastDY = 0;
  runInertia();
});

/* Touch support */
let lastTX = 0, lastTY = 0, lastTDX = 0, lastTDY = 0;
stage.addEventListener('touchstart', e => {
  const t = e.touches[0];
  lastTX = t.clientX; lastTY = t.clientY;
  vx = vy = 0;
}, { passive: true });

stage.addEventListener('touchmove', e => {
  const t = e.touches[0];
  lastTDX = t.clientX - lastTX;
  lastTDY = t.clientY - lastTY;
  wx += lastTDX; wy += lastTDY;
  lastTX = t.clientX; lastTY = t.clientY;
  gsap.set('#world', { x: wx, y: wy });
  updateCounter();
  e.preventDefault();
}, { passive: false });

stage.addEventListener('touchend', () => {
  vx = lastTDX * 1.8; vy = lastTDY * 1.8;
  runInertia();
});

function runInertia() {
  if (Math.abs(vx) < 0.5 && Math.abs(vy) < 0.5) return;
  vx *= FRICTION; vy *= FRICTION;
  wx += vx; wy += vy;
  gsap.to('#world', { x: wx, y: wy, duration: 0.06, ease: 'none', onComplete: runInertia });
  updateCounter();
}

/* ═══════════════════════════════════════════════
   COUNTER (which cards are roughly in view)
═══════════════════════════════════════════════ */
function updateCounter() {
  // Find first visible card (rough heuristic)
  const cx = -wx + window.innerWidth / 2;
  const cy = -wy + window.innerHeight / 2;
  let best = 0, bestD = Infinity;
  POSITIONS.forEach(([px, py], i) => {
    const d = Math.hypot(px + 150 - cx, py + 225 - cy);
    if (d < bestD) { bestD = d; best = i; }
  });
  document.getElementById('counter').textContent =
    `${String(best + 1).padStart(2, '0')} — ${String(ITEMS.length).padStart(2, '0')}`;
}

/* ═══════════════════════════════════════════════
   CARD HOVER PARALLAX
═══════════════════════════════════════════════ */
document.querySelectorAll('.card').forEach(card => {
  card.addEventListener('mousemove', e => {
    if (dragging) return;
    const rect = card.getBoundingClientRect();
    const mx = (e.clientX - rect.left) / rect.width  - 0.5;
    const my = (e.clientY - rect.top)  / rect.height - 0.5;
    const base = parseFloat(card.style.cssText.match(/rotation: ?([\d.-]+)/)?.[1] || 0);
    gsap.to(card.querySelector('.card-img'), {
      x: mx * 10, y: my * 8, scale: 1.04, duration: 0.4, ease: 'power2.out'
    });
  });
  card.addEventListener('mouseleave', () => {
    gsap.to(card.querySelector('.card-img'), {
      x: 0, y: 0, scale: 1, duration: 0.6, ease: 'power3.out'
    });
  });
});

/* ═══════════════════════════════════════════════
   DETAIL PAGE
═══════════════════════════════════════════════ */
const detail = document.getElementById('detail');

function openDetail(idx) {
  if (dragging) return;  // ignore click after drag
  const item = ITEMS[idx];

  document.getElementById('detail-image').src = imgUrl(idx, 1200, 900);
  document.getElementById('detail-num').textContent = `${String(idx + 1).padStart(2, '0')} / ${ITEMS.length}`;
  document.getElementById('detail-title').textContent = item.title;
  document.getElementById('detail-desc').textContent = item.desc;
  document.getElementById('detail-tags').innerHTML =
    item.tags.map(t => `<span class="detail-tag">${t}</span>`).join('');

  detail.classList.add('active');

  // Source card rect for origin-based reveal
  const cards = document.querySelectorAll('.card');
  const card = cards[idx];
  const rect = card.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top  + rect.height / 2;

  gsap.timeline()
    .set(detail, { opacity: 0, clipPath: `circle(0% at ${cx}px ${cy}px)` })
    .to(detail, {
      opacity: 1,
      clipPath: `circle(150% at ${cx}px ${cy}px)`,
      duration: 0.75, ease: 'power3.inOut'
    })
    .from('#detail-num',   { y: 20, opacity: 0, duration: 0.4, ease: 'power2.out' }, '-=0.3')
    .from('#detail-title', { y: 30, opacity: 0, duration: 0.5, ease: 'power2.out' }, '-=0.35')
    .from('#detail-desc',  { y: 20, opacity: 0, duration: 0.4, ease: 'power2.out' }, '-=0.3')
    .from('#detail-tags .detail-tag', {
      y: 10, opacity: 0, stagger: 0.07, duration: 0.35, ease: 'power2.out'
    }, '-=0.25');
}

document.getElementById('detail-close').addEventListener('click', () => {
  gsap.to(detail, {
    opacity: 0, duration: 0.5, ease: 'power2.inOut',
    onComplete: () => detail.classList.remove('active')
  });
});

/* ESC to close */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && detail.classList.contains('active')) {
    document.getElementById('detail-close').click();
  }
});

/* ═══════════════════════════════════════════════
   ENTRANCE ANIMATION
═══════════════════════════════════════════════ */
gsap.from('.card', {
  y: 60, opacity: 0, stagger: 0.05, duration: 0.8,
  ease: 'power3.out', delay: 0.2
});
gsap.from('#header', { y: -30, opacity: 0, duration: 0.6, ease: 'power2.out', delay: 0.1 });
gsap.from('#drag-hint', { opacity: 0, duration: 1, delay: 1.4 });

/* Initial counter */
updateCounter();

/* Fade drag hint after a few seconds */
gsap.to('#drag-hint', { opacity: 0, duration: 0.8, delay: 4 });
</script>
</body>
</html>
